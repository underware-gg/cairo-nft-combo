[workspace]
members = [
  "packages/nft_combo",
  # "example",
]
description = "A Cairo component extending OpenZeppelin ERC-721 tokens"
homepage = "https://github.com/underware-gg/cairo-nft-combo"
cairo-version = ">=2.13.1"

[workspace.package]
version = "1.2.0"
edition = "2024_07"

[workspace.dependencies]
starknet = ">=2.13.1"
cairo_test = ">=2.13.1"
openzeppelin = ">=1.0.0"

[workspace.tool.fmt]
sort-module-level-items = true

#--------------------------
# Dojo profiles declaration
#
[profile.dev]
[profile.slot]
[profile.sepolia]
[profile.mainnet]
